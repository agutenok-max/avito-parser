name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt
      - name: Проверка синтаксиса всех Python-файлов
        run: python -m compileall -q .
      - name: Тесты
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Сборка Docker-образа
        run: docker build -t avito-bot .
      - name: Проверка, что в образе всё импортируется и браузер запускается
        run: |
          docker run --rm -e TELEGRAM_BOT_TOKEN= avito-bot python -c "
          import telegram_bot.bot, telegram_bot.handlers, telegram_bot.monitor
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True, args=['--no-sandbox']); b.close()
          print('OK: imports + headless Chromium')
          "
      - name: Без токена бот завершается с понятной ошибкой
        run: |
          docker run --rm -e TELEGRAM_BOT_TOKEN= avito-bot 2>&1 | tee out.txt || true
          grep -q "TELEGRAM_BOT_TOKEN" out.txt
